[tools]
aws-cli = { version = "latest", symlink_bins = "true" }
bat = "latest"
bun = "1.4.4"
"cargo:cargo-nextest" = "latest"
chezmoi = "latest"
d2 = "latest"
direnv = "latest"
eza = "latest"
fzf = "latest"
gh = "latest"
ghq = "latest"
"github:crate-ci/committed" = "latest"
"github:hisamekms/dcw" = "0.5.1"
"github:hisamekms/secretmux" = "0.2.1"
"github:hisamekms/senko" = "0.51.0"
"github:j178/prek" = "latest"
"github:taiki-e/cargo-llvm-cov" = "latest"
go = "latest"
"go:github.com/satococoa/wtp/v2/cmd/wtp" = "latest"
"go:tailscale.com/cmd/tailscale" = "latest"
"go:tailscale.com/cmd/tailscaled" = "latest"
jq = "latest"
lazygit = "latest"
neovim = "latest"
node = "latest"
"npm:@devcontainers/cli" = "latest"
"npm:@openai/codex" = "latest"
"npm:@playwright/cli" = "latest"
"npm:domaintrail" = "latest"
